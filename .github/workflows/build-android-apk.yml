name: Build Odin Boss Timer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize isolated Capacitor 7 Android shell
        run: |
          rm -rf cap-build
          mkdir -p cap-build/dist
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              "cap-build/dist/index.html",
              "<!doctype html><html lang=\"ko\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"></head><body style=\"margin:0;background:#020617;color:#f59e0b;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;\"><div>오딘 보스 타임 AI 불러오는 중...</div></body></html>"
            );
            fs.writeFileSync(
              "cap-build/package.json",
              JSON.stringify({ name: "odin-boss-timer-apk", version: "1.0.0", private: true }, null, 2)
            );
            fs.writeFileSync(
              "cap-build/capacitor.config.json",
              JSON.stringify({
                appId: "com.odin.bosstimer",
                appName: "오딘 보스 타임 AI",
                webDir: "dist",
                server: {
                  url: "https://ais-pre-mkscy2qmwolwkwxcv3zm75-460202069693.asia-east1.run.app",
                  cleartext: false,
                  androidScheme: "https"
                },
                android: {
                  allowMixedContent: false,
                  backgroundColor: "#020617"
                },
                plugins: {
                  LocalNotifications: {
                    smallIcon: "ic_notification",
                    iconColor: "#F59E0B"
                  }
                }
              }, null, 2)
            );
          '
          cd cap-build
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap add android

      - name: Configure Android exact alarm & notification permissions
        working-directory: cap-build
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const manifestPath = path.join("android", "app", "src", "main", "AndroidManifest.xml");
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED"
            ];
            for (const p of perms) {
              if (!manifest.includes(p)) {
                manifest = manifest.replace("<application", `    <uses-permission android:name="${p}" />\n    <application`);
              }
            }
            fs.writeFileSync(manifestPath, manifest, "utf8");

            const drawableDir = path.join("android", "app", "src", "main", "res", "drawable");
            fs.mkdirSync(drawableDir, { recursive: true });
            fs.writeFileSync(
              path.join(drawableDir, "ic_notification.xml"),
              `<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24" android:tint="#FFFFFF"><path android:fillColor="#FFFFFFFF" android:pathData="M14.5,17.5L3,6V3h3l11.5,11.5L14.5,17.5zM17.5,20.5l-2,-2l2,-2l2,2L17.5,20.5zM19,3h2v3l-4.5,4.5l-1.5,-1.5L19,5V3zM6.5,14.5L3,18v3h3l3.5,-3.5L6.5,14.5z"/></vector>`,
              "utf8"
            );
          '
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: cap-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-boss-timer-ai-apk
          path: cap-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
